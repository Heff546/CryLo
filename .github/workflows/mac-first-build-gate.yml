name: CryLo macOS Intel native first-build gate

on:
  push:
    branches:
      - feature/mac-first-build-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crylo-mac-first-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-intel:
    name: macOS 15 Intel pinned-dependencies configure and build
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Check out exact CryLo commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive

      - name: Read-only macOS toolchain and source audit
        shell: bash
        run: |
          set -euo pipefail
          echo "===== EXACT SOURCE ====="
          git rev-parse HEAD
          git status --short
          echo "===== HOST ====="
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          df -h .
          xcode-select -p
          xcrun --find clang
          clang --version
          echo "===== TOOLS ====="
          for tool in git cmake make python3 perl pkg-config autoconf automake glibtoolize brew; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: $(command -v "$tool")"
            else
              echo "MISSING: $tool"
            fi
          done
          echo "===== PINNED DEPENDENCY RECIPES ====="
          grep -E '^\$\(package\)_version=' contrib/depends/packages/{boost,openssl,zeromq,unbound,libusb,hidapi,protobuf,abseil,sodium}.mk

      - name: Provision host-only dependency build tools on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          packages=()
          command -v cmake >/dev/null 2>&1 || packages+=(cmake)
          command -v pkg-config >/dev/null 2>&1 || packages+=(pkgconf)
          command -v autoconf >/dev/null 2>&1 || packages+=(autoconf)
          command -v automake >/dev/null 2>&1 || packages+=(automake)
          command -v glibtoolize >/dev/null 2>&1 || packages+=(libtool)
          if [ "${#packages[@]}" -gt 0 ]; then
            brew install "${packages[@]}"
          fi
          cmake --version
          make --version | head -2

      - name: Probe Intel macOS compiler deployment target
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'int main(void) { return 0; }\n' > "$tmp/probe.c"
          xcrun --show-sdk-version
          for version in 10.8 11.0 15.0; do
            echo "===== COMPILER LINK TEST: macOS $version ====="
            set +e
            clang "-mmacosx-version-min=$version" "$tmp/probe.c" -o "$tmp/probe-$version" >"$tmp/log-$version" 2>&1
            rc=$?
            set -e
            cat "$tmp/log-$version"
            echo "EXIT=$rc"
          done

      - name: Preflight exact libiconv compiler flags with explicit SDK
        shell: bash
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$SDKROOT"
          echo "SDKROOT=$SDKROOT"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'int main(void) { return 0; }\n' > "$tmp/conftest.c"
          prefix="$GITHUB_WORKSPACE/contrib/depends/x86_64-apple-darwin11"
          mkdir -p "$prefix/include" "$prefix/lib"
          xcrun clang -mmacosx-version-min=10.8 -pipe -O1 \
            -I"$prefix/include" -L"$prefix/lib" \
            "$tmp/conftest.c" -o "$tmp/conftest"
          file "$tmp/conftest"
          "$tmp/conftest"
          echo "===== EXACT LIBICONV COMPILER PREFLIGHT PASSED ====="

      - name: Build hash-pinned native CryLo dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "===== COMPILER ENVIRONMENT ====="
          xcrun --show-sdk-path
          xcrun --show-sdk-version
          xcrun --find clang
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"
          echo "===== DEPENDENCIES ====="
          set +e
          make -C contrib/depends HOST=x86_64-apple-darwin11 -j2
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== DEPENDS FAILED (EXIT $rc) ====="
            echo "===== LIBICONV CONFIGURATION LOGS ====="
            find contrib/depends/work/build -path '*/libiconv/*/config.log' -type f -print | while IFS= read -r log; do
              echo "===== $log ====="
              sed -n '1,170p' "$log"
            done
            exit "$rc"
          fi
          test -f contrib/depends/x86_64-apple-darwin11/share/toolchain.cmake
          echo "===== DEPENDS TOOLCHAIN READY ====="
          ls -l contrib/depends/x86_64-apple-darwin11/share/toolchain.cmake
          df -h .

      - name: Configure native CryLo with full Trezor support
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/mac-x64 \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/contrib/depends/x86_64-apple-darwin11/share/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TAG=mac-x64 \
            -DBUILD_TESTS=OFF \
            -DBUILD_DOCUMENTATION=OFF \
            -DBUILD_DEBUG_UTILITIES=OFF \
            -DBUILD_GUI_DEPS=OFF \
            -DSTATIC=ON \
            -DUSE_DEVICE_TREZOR=ON \
            -DUSE_DEVICE_TREZOR_LIBUSB=ON \
            -DTREZOR_DEBUG=OFF \
            -DBUILD_64=ON \
            -DARCH=x86-64
          git status --short

      - name: Compile daemon wallet and wallet-RPC
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/mac-x64 --parallel 2 --target daemon simplewallet wallet_rpc_server

      - name: Verify native macOS runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          for name in CryLo-daemon CryLo-wallet CryLo-wallet-rpc; do
            file "build/mac-x64/bin/$name"
            otool -L "build/mac-x64/bin/$name"
            "build/mac-x64/bin/$name" --version
          done
          test -z "$(git status --porcelain --untracked-files=all -- . ':!build' ':!contrib/depends')"
          echo "===== NATIVE MAC X64 COMPILE GATE COMPLETE ====="

      - name: Package unsigned CryLo Electron macOS x64 DMG
        shell: bash
        env:
          CRYLO_RELEASE_BIN: ${{ github.workspace }}/build/mac-x64/bin
          CRYLO_NETWORK: testnet
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm run --prefix electron build-mac-x64

      - name: Verify unsigned macOS app bundle and DMG
        shell: bash
        run: |
          set -euo pipefail
          app="electron/dist/mac/CryLo Wallet.app"
          test -d "$app/Contents/Resources/bin/mac"
          for name in CryLo-daemon CryLo-wallet-rpc; do
            bundled="$app/Contents/Resources/bin/mac/$name"
            original="build/mac-x64/bin/$name"
            test -x "$bundled"
            cmp "$original" "$bundled"
            file "$bundled"
            otool -L "$bundled"
          done
          test -f "$app/Contents/Resources/bin/mac/BINARY-MANIFEST.txt"
          find electron/dist -maxdepth 1 -type f -name '*.dmg' -print
          find electron/dist -maxdepth 1 -type f -name '*.dmg' -print -quit | grep -q .
          shasum -a 256 electron/dist/*.dmg
          echo "===== UNSIGNED MAC DMG PACKAGING GATE COMPLETE ====="

      - name: Upload unsigned macOS test DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crylo-macos-intel-unsigned-test
          path: electron/dist/*.dmg
          if-no-files-found: error
          retention-days: 7
