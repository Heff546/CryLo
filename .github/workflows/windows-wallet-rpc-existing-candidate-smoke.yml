name: CryLo Windows existing unsigned wallet RPC smoke — no rebuild or release

on:
  push:
    branches:
      - audit/windows-warning-fixes
    paths:
      - .github/workflows/windows-wallet-rpc-existing-candidate-smoke.yml
      - scripts/tests/windows_wallet_rpc_existing_candidate_smoke.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  unsigned-rpc-smoke:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout audit source for independent public vectors
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Download only the previously successful unsigned Windows artifact
        shell: bash
        env:
          GH_$: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_run=40807758891
          expected_sha=9b876fa5aa726606d2b3dd5651f196d317ba222b
          existing="$(gh api "repos/Heff546/CryLo/actions/runs/$expected_run" --jq '.head_sha')"
          status="$(gh api "repos/Heff546/CryLo/actions/runs/$expected_run" --jq '.conclusion')"
          test "$existing" = "$expected_sha" || { echo "ERROR: approved candidate revision mismatch"; exit 1; }
          test "$status" = "success" || { echo "ERROR: approved candidate did not pass CI"; exit 1; }
          mkdir -p "$RUNNER_TEMP/crylo-existing-unsigned"
          gh run download "$expected_run" --repo Heff546/CryLo \
            --name crylo-unified-windows-x64-unsigned-native-candidate \
            --dir "$RUNNER_TEMP/crylo-existing-unsigned"
          echo 'PASS: downloaded exact prior Windows candidate; no build performed'

      - name: Validate actual Windows wallet-RPC from existing candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tests/windows_wallet_rpc_existing_candidate_smoke.py \
            "$RUNNER_TEMP/crylo-existing-unsigned" \
            "$RUNNER_TEMP/crylo-existing-unsigned-rpc-report.json"
          python - "$RUNNER_TEMP/crylo-existing-unsigned-rpc-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf8"))
          assert r["releaseFrozen"] and r["mayPublish"] is False
          assert r["walletRPCExecuted"] is True
          assert r["uriFixExecuted"] is False
          assert r["multisigAndTransferIntegrationExecuted"] is False
          print("PASS: previous binary smoke is not a release gate")
          PY

      - name: Retain source-limited RPC evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-windows-prior-unsigned-wallet-rpc-smoke-audit-only
          path: ${{ runner.temp }}/crylo-existing-unsigned-rpc-report.json
          if-no-files-found: ignore
          retention-days: 30
