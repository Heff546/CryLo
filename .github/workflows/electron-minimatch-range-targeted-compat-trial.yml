name: CryLo focused minimatch 9/10 patch and legacy glob ASAR compatibility trial

on:
  push:
    branches: [audit/windows-warning-fixes]
    paths:
      - .github/workflows/electron-minimatch-range-targeted-compat-trial.yml
      - scripts/tests/electron-minimatch-range-targeted-trial.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-range-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [range-parent, range-exact, range-parent-nested]
    steps:
      - name: Checkout unchanged audited CryLo Electron dependency lock
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Pin reviewed npm 12.1.0
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --no-audit --no-fund --ignore-scripts npm@12.1.0
          test "$(npm --version)" = 12.1.0

      - name: Trial patch only minimatch 9 and 10; require zero advisories and working legacy APIs
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          OUTPUT: ${{ runner.temp }}/crylo-minimatch-range.json
        run: |
          set -euo pipefail
          node --check scripts/tests/electron-minimatch-range-targeted-trial.js
          node scripts/tests/electron-minimatch-range-targeted-trial.js "$VARIANT" "$OUTPUT"
          node - "$OUTPUT" <<'NODE'
          const fs=require('fs'),report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!report.executionValid||!report.sourceUnchanged)throw Error('Disposable dependency trial did not complete safely');
          if(!report.candidateSafe)throw Error('NOT SAFE: '+JSON.stringify({audit:report.fullAudit?.counts,checks:report.checks,error:report.error}));
          console.log('PASS: 0 full advisories, preserved legacy ASAR/glob API, Electron builder and cross-platform file filters');
          NODE

      - name: Save exact trial report (never a release package)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-minimatch-range-${{ matrix.variant }}-evidence
          path: ${{ runner.temp }}/crylo-minimatch-range.json
          if-no-files-found: warn
          retention-days: 30
