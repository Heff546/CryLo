name: CryLo Testnet.27 five-platform unsigned artifact verification and staging

# No compilation, signing, tagging, release publication, or installer execution.
# Reconcile successful CI artifacts against the frozen native release source.
on:
  push:
    branches:
      - release/testnet27-five-platform-20261123
    paths:
      - .github/workflows/testnet27-five-artifact-staging.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-and-stage:
    name: Verify five completed platform artifacts without rebuilding
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact shared CryLo release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: e2b37014d7b31d100003b28e2e2b9df76cbe1ffe
          persist-credentials: false
          set-safe-directory: false
          submodules: false

      - name: Recheck frozen shared source and release safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e2b37014d7b31d100003b28e2e2b9df76cbe1ffe'
          test -z "$(git status --porcelain --untracked-files=all)"
          node --check scripts/crylo.js
          node --check scripts/release/crylo-release.js
          node --check scripts/release/verify-release-manifest.js
          node --test scripts/tests/signed-update-contract.test.js
          node --test security/tests/linux-native-update-preflight.test.js
          node scripts/tests/install-win-linux-pi-static.js
          echo 'PASS: frozen five-platform source and signed-update safety'

      - name: Download exactly the five successful unsigned artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crylo-testnet27-input" "$RUNNER_TEMP/crylo-testnet27-staging"
          echo "CRYLO_INPUT=$RUNNER_TEMP/crylo-testnet27-input" >> "$GITHUB_ENV"
          echo "CRYLO_OUTPUT=$RUNNER_TEMP/crylo-testnet27-staging" >> "$GITHUB_ENV"
          for record in \
            'win-x64|45100788862|137450921064|d40d367d446ea1c9377a5ea5ce033f7fe9d9e931|14787399874|crylo-unified-windows-x64-unsigned-native-candidate' \
            'linux-x64|45100788862|137450920976|d40d367d446ea1c9377a5ea5ce033f7fe9d9e931|14787041044|crylo-unified-linux-x64-unsigned-build' \
            'linux-arm64|45100788862|137450921168|d40d367d446ea1c9377a5ea5ce033f7fe9d9e931|14786993236|crylo-unified-linux-arm64-unsigned-build' \
            'mac-x64|45100788862|137450920746|d40d367d446ea1c9377a5ea5ce033f7fe9d9e931|14787958366|crylo-testnet27-mac-x64-UNSIGNED' \
            'mac-arm64|45100788862|137450921004|d40d367d446ea1c9377a5ea5ce033f7fe9d9e931|14786820499|crylo-testnet27-mac-arm64-UNSIGNED'; do
            IFS='|' read -r target run job run_sha artifact name <<< "$record"
            test "$(gh api "repos/Heff546/CryLo/actions/runs/$run" --jq '.head_sha')" = "$run_sha"
            test "$(gh api "repos/Heff546/CryLo/actions/jobs/$job" --jq '.conclusion')" = success
            test "$(gh api "repos/Heff546/CryLo/actions/artifacts/$artifact" --jq '.name')" = "$name"
            test "$(gh api "repos/Heff546/CryLo/actions/artifacts/$artifact" --jq '.expired')" = false
            test "$(gh api "repos/Heff546/CryLo/actions/artifacts/$artifact" --jq '.workflow_run.id')" = "$run"
            gh run download "$run" --repo Heff546/CryLo \
              --name "$name" --dir "$RUNNER_TEMP/crylo-testnet27-input/$target"
            test -n "$(find "$RUNNER_TEMP/crylo-testnet27-input/$target" -type f -print -quit)"
            echo "PASS: $target source run $run, job $job, artifact $artifact"
          done

      - name: Verify native hashes, architecture, provenance and stage exact release bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct, subprocess, tarfile, zipfile
          from pathlib import Path

          SOURCE = "e2b37014d7b31d100003b28e2e2b9df76cbe1ffe"
          VERSION = "1.1.1"
          root = Path(os.environ["CRYLO_INPUT"])
          out = Path(os.environ["CRYLO_OUTPUT"])
          assert out.is_dir() and not list(out.iterdir()), "Staging must start empty"
          expected_tree = subprocess.check_output(["git", "ls-tree", "-r", SOURCE])
          targets = [("win", "x64"), ("linux", "x64"), ("linux", "arm64"), ("mac", "x64"), ("mac", "arm64")]
          native_names = ["CryLo-daemon", "CryLo-wallet", "CryLo-wallet-rpc"]

          def files(target):
              d = root / target
              assert d.is_dir(), f"Missing artifact directory: {d}"
              all_paths = list(d.rglob("*"))
              assert all_paths and all(not p.is_symlink() for p in all_paths), f"Symlink or empty artifact: {d}"
              assert all(p.is_file() or p.is_dir() for p in all_paths), f"Special file in artifact: {d}"
              return [p for p in all_paths if p.is_file()]

          def one(items, name):
              found = [p for p in items if p.name == name]
              assert len(found) == 1, f"Expected exactly one {name}, got {len(found)}"
              return found[0]

          def hash_file(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def receipts(items, name):
              receipt = {}
              for line in one(items, name).read_text().splitlines():
                  digest, file = line.strip().split(None, 1)
                  filename = Path(file.lstrip("*")).name
                  assert len(digest) == 64 and all(c in "0123456789abcdef" for c in digest), line
                  assert filename not in receipt, f"Duplicate receipt: {filename}"
                  receipt[filename] = digest
              return receipt

          def check_hash(path, expected, size=None):
              if size is not None:
                  assert path.stat().st_size == size, f"Size mismatch: {path}"
              assert hash_file(path) == expected, f"SHA256 mismatch: {path}"

          def elf(path, machine):
              with path.open("rb") as f:
                  b = f.read(64)
              assert len(b) >= 20 and b[:4] == b"\x7fELF", path
              assert b[4:6] == bytes([2, 1]) and struct.unpack_from("<H", b, 18)[0] == machine, path

          def macho(path, cpu):
              with path.open("rb") as f:
                  b = f.read(32)
              assert len(b) == 32 and struct.unpack_from("<I", b, 0)[0] == 0xfeedfacf, path
              assert struct.unpack_from("<I", b, 4)[0] == cpu, path

          def pe(path, machines=(0x8664,)):
              with path.open("rb") as f:
                  dos = f.read(64)
                  assert len(dos) == 64 and dos[:2] == b"MZ", path
                  off = struct.unpack_from("<I", dos, 0x3c)[0]
                  assert 64 <= off <= 1048576, f"Invalid PE header offset: {path}"
                  f.seek(off)
                  header = f.read(6)
              assert len(header) == 6 and header[:4] == b"PE\x00\x00", path
              machine = struct.unpack_from("<H", header, 4)[0]
              assert machine in machines, f"Unexpected PE machine {machine:#06x}: {path}"
              return machine

          candidates = []
          def record(platform, arch, artifact):
              candidates.append({"platform": platform, "architecture": arch, "file": artifact.name,
                                 "sha256": hash_file(artifact), "size": artifact.stat().st_size})
              print(f"PASS {platform}/{arch}: {artifact.name} SHA256 {candidates[-1]['sha256']}")

          # Windows ZIP: reconstruct the verified native root set, complete runtime DLL
          # closure, runtime and binary manifests, and the Electron setup executable.
          win = files("win-x64")
          assert one(win, "SOURCE-COMMIT.txt").read_text().strip() == SOURCE
          manifest_file = one(win, "WINDOWS-BUILD-RUNTIME-MANIFEST.json")
          manifest = json.loads(manifest_file.read_text())
          assert manifest["gitCommit"] == SOURCE, "Windows runtime provenance mismatch"
          assert set(x["file"] for x in manifest["roots"]) == {n+".exe" for n in native_names}
          assert manifest["runtime"], "Windows DLL closure empty"
          selection = {}
          for entry in manifest["roots"] + manifest["runtime"]:
              p = one(win, entry["file"])
              check_hash(p, entry["sha256"], entry["size"])
              pe(p)
              assert p.name not in selection, f"Duplicate Windows file: {p.name}"
              selection[p.name] = p
          binary_manifest = one(win, "BINARY-MANIFEST.txt")
          assert f"Runtime-Manifest-SHA256: {hash_file(manifest_file)}" in binary_manifest.read_text()
          selection[manifest_file.name] = manifest_file
          selection[binary_manifest.name] = binary_manifest
          installer = one(win, f"CryLo Wallet Setup {VERSION}.exe")
          # NSIS installers can use a 32-bit PE bootstrapper while carrying an
          # x64 application. Require valid x86/x64 PE for the bootstrapper; all
          # three actual CryLo roots and every runtime DLL remain strictly x64.
          installer_machine = pe(installer, machines=(0x014c, 0x8664))
          print(f"PASS: NSIS bootstrapper PE {installer_machine:#06x}; CryLo native roots and DLLs strictly AMD64")
          selection[f"CryLo-Wallet-Setup-{VERSION}-x64.exe"] = installer
          zip_path = out / f"CryLo-Release-{VERSION}-win-x64.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=8) as z:
              for name, p in sorted(selection.items()):
                  z.write(p, arcname=name)
          with zipfile.ZipFile(zip_path) as z:
              assert len(z.namelist()) == len(selection) and set(z.namelist()) == set(selection)
              assert z.testzip() is None, "Windows ZIP integrity check failed"
          record("win", "x64", zip_path)

          for arch in ("x64", "arm64"):
              members = files(f"linux-{arch}")
              assert one(members, "SOURCE-COMMIT.txt").read_text().strip() == SOURCE
              native_hashes = receipts(members, "NATIVE-SHA256SUMS.txt")
              natives = []
              for name in native_names:
                  p = one(members, name)
                  check_hash(p, native_hashes[name])
                  elf(p, 0x3e if arch == "x64" else 0xb7)
                  natives.append(p)
              app_name = (f"CryLo Wallet-{VERSION}.AppImage" if arch == "x64"
                          else f"CryLo Wallet-{VERSION}-arm64.AppImage")
              app = one(members, app_name)
              elf(app, 0x3e if arch == "x64" else 0xb7)
              tar_path = out / f"CryLo-Release-{VERSION}-linux-{arch}.tar"
              entries = [(p, p.name) for p in natives] + [(app, f"CryLo-Wallet-{VERSION}-{arch}.AppImage")]
              with tarfile.open(tar_path, "w", format=tarfile.USTAR_FORMAT) as tar:
                  for p, name in sorted(entries, key=lambda x: x[1]):
                      info = tar.gettarinfo(str(p), arcname=name)
                      info.uid = info.gid = 0
                      info.uname = info.gname = ""
                      info.mtime = 0
                      info.mode = 0o755
                      with p.open("rb") as f:
                          tar.addfile(info, f)
              with tarfile.open(tar_path) as tar:
                  assert set(tar.getnames()) == {e[1] for e in entries}
              record("linux", arch, tar_path)

          for arch in ("x64", "arm64"):
              members = files(f"mac-{arch}")
              assert one(members, "SOURCE-COMMIT.txt").read_text().strip() == SOURCE
              assert one(members, "ALL-TRACKED-FILES.txt").read_bytes() == expected_tree
              hashes = receipts(members, "NATIVE-SHA256SUMS.txt")
              for name in native_names:
                  p = one(members, name)
                  check_hash(p, hashes[name])
                  macho(p, 0x01000007 if arch == "x64" else 0x0100000c)
              pkg = one(members, f"CryLo-{VERSION}-mac-{arch}-unsigned.pkg")
              check_hash(pkg, receipts(members, "PKG-SHA256SUMS.txt")[pkg.name])
              dest = out / pkg.name
              shutil.copyfile(pkg, dest)
              record("mac", arch, dest)

          assert len(candidates) == 5 and len({c["file"] for c in candidates}) == 5
          report = {"classification": "UNSIGNED_CI_STAGING_ONLY", "sourceCommit": SOURCE,
                    "version": VERSION, "network": "testnet", "signed": False, "published": False,
                    "pi1SigningRequired": True, "candidates": candidates}
          (out / "UNSIGNED-STAGING-ONLY.json").write_text(json.dumps(report, indent=2)+"\n")
          (out / "SHA256SUMS-CI-ONLY.txt").write_text(
              "".join(f"{c['sha256']}  {c['file']}\n" for c in candidates))
          (out / "NO-SIGNATURE-OR-PUBLICATION.txt").write_text(
              "Verified CI-only source artifacts. Pi1 must authorize official manifest signing.\n")
          print("PASS: five exact source-matched unsigned release candidates")
          PY
          (cd "$CRYLO_OUTPUT" && sha256sum -c SHA256SUMS-CI-ONLY.txt)
          test "$(find "$CRYLO_OUTPUT" -maxdepth 1 -type f -name '*.pkg' | wc -l)" -eq 2
          test "$(find "$CRYLO_OUTPUT" -maxdepth 1 -type f -name '*.tar' | wc -l)" -eq 2
          test "$(find "$CRYLO_OUTPUT" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1

      - name: Upload five verified unsigned release bundles for offline Pi1 signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-testnet27-five-verified-UNSIGNED-DO-NOT-PUBLISH
          path: ${{ env.CRYLO_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
