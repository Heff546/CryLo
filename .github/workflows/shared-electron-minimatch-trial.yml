name: CryLo shared Electron minimatch remedies (no native build)

on:
  push:
    branches: [audit/windows-warning-fixes]
    paths:
      - scripts/tests/electron-minimatch-trial.js
      - .github/workflows/shared-electron-minimatch-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        candidate: [scoped-10, scoped-9-10]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: |
          npm install --global --no-audit --no-fund --ignore-scripts npm@12.1.0
          test "$(npm --version)" = '12.1.0'
      - name: Compare disposable locks, vulnerability audit and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tests/electron-minimatch-trial.js "${{ matrix.candidate }}" "$RUNNER_TEMP/minimatch-trial.json"
          echo 'No native build, installer, signing or release'
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-minimatch-trial-${{ matrix.candidate }}
          path: ${{ runner.temp }}/minimatch-trial.json
          if-no-files-found: error
          retention-days: 30
