name: CryLo isolated nested minimatch compatibility trial

on:
  push:
    branches: [audit/windows-warning-fixes]
    paths:
      - scripts/tests/electron-minimatch-nested-trial.js
      - .github/workflows/electron-minimatch-nested-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        case: [scoped-10-nested, scoped-9-10-nested]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Pin npm
        run: |
          npm install --global --no-audit --no-fund --ignore-scripts npm@12.1.0
          test "$(npm --version)" = '12.1.0'
      - name: Isolated nested dependency and packaging API checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tests/electron-minimatch-nested-trial.js "${{ matrix.case }}" "$RUNNER_TEMP/crylo-nested-minimatch.json"
          echo "Disposable trial only; no canonical package changes, no binaries or signing."
      - name: Retain trial results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-nested-minimatch-${{ matrix.case }}
          path: ${{ runner.temp }}/crylo-nested-minimatch.json
          if-no-files-found: warn
          retention-days: 30
