name: CryLo shared C++ security smoke gate
on:
  push:
    branches:
      - feature/mac-first-build-gate
    paths:
      - src/device/log.cpp
      - src/device/log.hpp
      - .github/workflows/shared-device-security-smoke.yml
      - .github/workflows/mac-first-build-gate.yml
      - electron/package.json
      - electron/package-lock.json
      - node-operator/runtime/package.json
      - node-operator/runtime/package-lock.json
      - contrib/depends/packages/boost.mk
      - src/daemon/CMakeLists.txt
      - src/wallet/CMakeLists.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-logging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Compile and exercise actual shared logging function
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("src/device/log.cpp").read_text()
          match = re.search(r"  void buffer_to_str\(.*?\n  \}", text, re.S)
          if not match: raise SystemExit("Missing shared buffer_to_str")
          header = """#include <cstddef>
          #include <cstdio>
          #include <cstring>
          #include <limits>
          #include <stdexcept>
          #define CHECK_AND_ASSERT_THROW_MES(c, m) do { if (!(c)) throw std::runtime_error("bounds"); } while (0)
          namespace hw {
          """
          tests = """
          }
          int main() {
            char out[8] = {};
            hw::buffer_to_str(out, sizeof(out), "", 0);
            if (std::strcmp(out, "") != 0) return 1;
            const char raw[] = {char(0), char(0xaf), char(0xff)};
            hw::buffer_to_str(out, 7, raw, 3);
            if (std::strcmp(out, "00afff") != 0) return 2;
            bool rejected = false;
            try { hw::buffer_to_str(out, 6, raw, 3); }
            catch (const std::runtime_error&) { rejected = true; }
            if (!rejected) return 3;
            rejected = false;
            try { hw::buffer_to_str(out, 0, raw, 0); }
            catch (const std::runtime_error&) { rejected = true; }
            if (!rejected) return 4;
            rejected = false;
            try { hw::buffer_to_str(out, sizeof(out), raw, std::numeric_limits<size_t>::max()); }
            catch (const std::runtime_error&) { rejected = true; }
            if (!rejected) return 5;
            return 0;
          }
          """
          pathlib.Path("device-log-smoke.cpp").write_text(header + match.group(0) + tests)
          PY
          c++ -std=c++11 -Wall -Wextra -Werror device-log-smoke.cpp -o device-log-smoke
          ./device-log-smoke
          echo "PASS: Linux/macOS shared logging tests"

  dependency-scope:
    name: Dependency lockfile production-scope audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Verify production graph and pinned lockfile integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          banned = {'rimraf', 'glob', 'inflight', 'boolean'}
          for directory in ('electron', 'node-operator/runtime'):
              base = pathlib.Path(directory)
              manifest = json.loads((base / 'package.json').read_text())
              lock = json.loads((base / 'package-lock.json').read_text())
              assert lock['lockfileVersion'] == 3
              root = lock['packages']['']
              assert root['dependencies'] == manifest.get('dependencies', {}), directory
              assert root.get('devDependencies', {}) == manifest.get('devDependencies', {}), directory
              hits = []
              for name, meta in lock['packages'].items():
                  if not name or name.split('/')[-1] not in banned: continue
                  hits.append((name, meta.get('version'), meta.get('dev', False)))
                  if not meta.get('dev', False):
                      raise SystemExit(f'ERROR: {directory} production package: {name}')
              print(f'{directory}: {len(lock["packages"])-1} pinned packages; deprecated dependency hits: {hits}')
          electron = json.loads(pathlib.Path('electron/package.json').read_text())
          resources = electron['build']['extraResources']
          if not any(r.get('from') == '../node-operator/runtime/node_modules' and
                     r.get('to') == 'operator-runtime/node_modules' for r in resources):
              raise SystemExit('ERROR: operator runtime packaging mapping changed')
          print('PASS: production dependency scope and operator packaging mapping verified')
          PY

  static-link-audit:
    name: Read-only Boost and CMake link declaration audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Report Boost install targets and overlapping link declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          recipe = pathlib.Path('contrib/depends/packages/boost.mk').read_text()
          lines = recipe.splitlines()
          print('===== BOOST 1.92 PINNED RECIPE =====')
          for n, line in enumerate(lines, 1):
              if any(word in line for word in ('_version=', '_sha256_hash=', '_config_libraries=', './b2 ', '_config_opts_darwin=')):
                  print(f'{n}: {line.strip()}')
          if not re.search(r'^\$\(package\)_version=1\.92\.0$', recipe, re.M):
              raise SystemExit('Unexpected Boost version; review required')
          build = re.findall(r'^\s*\./b2[^\n]*$', recipe, re.M)
          if len(build) != 2:
              raise SystemExit('Expected exactly two Boost b2 invocations')
          print('===== EXPLICIT BUILD AND INSTALL COMMANDS =====')
          for line in build: print(line.strip())
          print('===== SHARED BOOST LINK DECLARATIONS =====')
          for target in ('src/daemon/CMakeLists.txt', 'src/wallet/CMakeLists.txt'):
              source = pathlib.Path(target).read_text()
              found = re.findall(r'\$\{Boost_[A-Z_]+_LIBRARY\}', source)
              counts = {item: found.count(item) for item in sorted(set(found))}
              print(f'{target}: {counts}')
              if not counts:
                  raise SystemExit(f'No Boost link variables located in {target}')
          print('AUDIT ONLY: no link flags, recipes, or binaries changed')
          PY
