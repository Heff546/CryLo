name: CryLo UTF8 cross-platform behavior characterization — no release
on:
  push:
    branches: [feature/mac-first-build-gate]
    paths:
      - .github/workflows/windows-utf8-characterization.yml
      - scripts/tests/utf8-platform-characterization.cpp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  characterize:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Install MinGW64 compiler for Windows probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\msys64\usr\bin\bash.exe')) { throw 'MSYS2 environment unavailable' }
          C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --noconfirm mingw-w64-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile behavior probe with native C++ compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            cxx="g++"
            output="utf8-characterization.exe"
          else
            cxx="c++"
            output="utf8-characterization"
          fi
          "$cxx" -std=c++17 -O0 -Wall -Wextra -I src \
            scripts/tests/utf8-platform-characterization.cpp -o "$output"
          "./$output"
