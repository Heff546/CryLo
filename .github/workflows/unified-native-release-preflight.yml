name: CryLo unified native Windows Linux ARM clean-host preflight

on:
  push:
    branches:
      - feature/mac-first-build-gate
    paths:
      - .github/workflows/unified-native-release-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release-preflight:
    name: Native release prerequisites — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, runner: ubuntu-24.04, arch: x86_64}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, arch: aarch64}
    steps:
      - name: Checkout reviewed mainnet-targeted CryLo release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: recursive
      - name: Validate host and pinned release inputs without compiling
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test -f contrib/depends/packages/boost.mk
          test -f contrib/depends/packages/openssl.mk
          test -f contrib/depends/packages/hidapi.mk
          test -f contrib/depends/packages/protobuf.mk
          test -f contrib/depends/packages/zeromq.mk
          test -f scripts/release/crylo-release.js
          sh -n ./crylo
          cmake --version | head -1
          gcc --version | head -1
          python3 --version
          make --version | head -1
          pkg-config --version
      - name: Execute normal-user single-command release precheck only
        shell: bash
        env:
          CRYLO_JOBS: '1'
        run: |
          set -euo pipefail
          sh ./crylo --check
          echo 'PASS: isolated pinned Node/npm and Linux native release prerequisites'
          echo 'NO native compilation, official tag, signing or publishing occurred'
  windows-release-preflight:
    name: Native release prerequisites — windows-x64 CMD
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed mainnet-targeted CryLo source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
          submodules: recursive
      - name: Inspect Windows CI build toolchain without modifying host packages
        shell: cmd
        run: |
          if not exist C:\msys64\usr\bin\bash.exe exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "export MSYSTEM=MINGW64; export PATH=/mingw64/bin:/usr/bin:$PATH; for cmd in gcc cmake make pacman pkg-config python3 protoc perl tar patch sha256sum; do command -v $cmd || exit 1; done"
          if errorlevel 1 exit /b 1
          echo PASS: Windows MSYS2 tool identities discovered
      - name: Run Windows normal-user CMD-only pinned CryLo release precheck
        shell: cmd
        run: |
          set "CRYLO_JOBS=1"
          call crylo.cmd --check
          if errorlevel 1 exit /b 1
          echo PASS: CMD-only pinned Node/MinGit and native release prerequisites
          echo NO native compilation, official tag, signing or publishing occurred
