name: CryLo modern upstream ASAR glob minimatch dependency stack compatibility trial

on:
  push:
    branches: [audit/windows-warning-fixes]
    paths:
      - .github/workflows/electron-upstream-modern-stack-compat-trial.yml
      - scripts/tests/electron-upstream-modern-stack-trial.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-modern:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        variant: [modern-current-builder, modern-upstream-v26, modern-parents-only]
    steps:
      - name: Checkout unchanged CryLo release package locks
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Pin npm 12.1.0
        shell: bash
        run: |
          set -euo pipefail
          npm install -g --no-audit --no-fund --ignore-scripts npm@12.1.0
          test "$(npm --version)" = 12.1.0
      - name: Test upstream-only replacement parents, zero advisories, ASAR and cross-platform packaging
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          OUTPUT: ${{ runner.temp }}/crylo-modern-upstream.json
        run: |
          set -euo pipefail
          node --check scripts/tests/electron-upstream-modern-stack-trial.js
          node scripts/tests/electron-upstream-modern-stack-trial.js "$VARIANT" "$OUTPUT"
          node - "$OUTPUT" <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!report.executionValid||!report.sourceUnchanged)throw Error('Trial could not complete safely');
          if(!report.candidateSafe)throw Error('RELEASE BLOCKED: '+JSON.stringify({
            counts:report.fullAudit?.counts,checks:report.checks,error:report.error}));
          console.log('PASS: exact upstream packages, zero npm advisories, functional ASAR and CryLo packaging compatibility');
          NODE
      - name: Store exact isolated result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-modern-upstream-${{ matrix.variant }}-nonrelease-evidence
          path: ${{ runner.temp }}/crylo-modern-upstream.json
          if-no-files-found: warn
          retention-days: 30
