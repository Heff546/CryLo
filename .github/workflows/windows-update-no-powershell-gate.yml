name: CryLo Windows updater without PowerShell gate
on:
  push:
    branches: [audit/windows-warning-fixes]
    paths:
      - scripts/crylo.js
      - scripts/windows-update-tools.js
      - scripts/windows-daemon-shortcuts.js
      - scripts/tests/windows-update-tools.test.js
      - .github/workflows/windows-update-no-powershell-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-updater:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Validate Windows tools and signed update orchestration
        shell: cmd
        run: |
          node --check scripts\crylo.js
          if errorlevel 1 exit /b 1
          node --test scripts\tests\windows-update-tools.test.js scripts\tests\signed-update-contract.test.js scripts\tests\windows-signed-update-positive-fixture.test.js
          if errorlevel 1 exit /b 1
          echo Scope: real ZIP and shortcut helpers, registry fixture, ephemeral signed orchestration.
          echo Official signed release, live HTTPS and NSIS update certification remain separate.
