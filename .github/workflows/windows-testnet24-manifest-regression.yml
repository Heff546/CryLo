name: CryLo five-platform Testnet.24 detached manifest and updater compatibility

on:
  push:
    branches: [release/testnet24-manifest-recovery]
    paths:
      - .github/workflows/windows-testnet24-manifest-regression.yml
      - scripts/release/create-release-manifest.js
      - scripts/release/sign-release-manifest.js
      - scripts/release/verify-release-manifest.js
      - scripts/tests/release-manifest-detached-selection.test.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-platform-release-selection:
    name: Manifest and release-selection — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-2022, family: win }
          - { target: linux-x64, runner: ubuntu-24.04, family: linux }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, family: linux }
          - { target: macos-intel, runner: macos-15-intel, family: mac }
          - { target: macos-arm64, runner: macos-15, family: mac }
    steps:
      - name: Checkout exact recovery source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Pin Node 24.21.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Verify all three shared release scripts and detached HEAD regression on this platform
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check scripts/release/create-release-manifest.js
          node --check scripts/release/sign-release-manifest.js
          node --check scripts/release/verify-release-manifest.js
          node --check scripts/tests/release-manifest-detached-selection.test.js
          node --test scripts/tests/release-manifest-detached-selection.test.js
          node --test scripts/tests/signed-update-contract.test.js
          node --test scripts/tests/windows-update-tools.test.js
          git diff --exit-code
          git diff --cached --exit-code

      - name: Verify previous Linux and macOS one-command update interfaces
        if: matrix.family != 'win'
        shell: bash
        run: |
          set -euo pipefail
          /bin/sh -n ./crylo
          /bin/sh -n scripts/release/macos-installed-command.sh
          node --test scripts/tests/macos-installed-command.test.js
          echo 'PASS: existing Linux and Mac user-facing CryLo update contracts unchanged'

      - name: Verify Windows CMD launcher and update-safe entry point
        if: matrix.family == 'win'
        shell: cmd
        run: |
          call crylo.cmd help
          if errorlevel 1 exit /b 1
          node scripts\tests\windows-launcher-snapshot.test.js
          if errorlevel 1 exit /b 1
          echo PASS: Windows command remains CMD-only
