        set -euo pipefail
        test "$(git rev-parse HEAD)" = 'e2b37014d7b31d100003b28e2e2b9df76cbe1ffe'
        test "$(uname -m)" = 'arm64'
        test -z "$(git status --porcelain --untracked-files=all)"
        test "$(node --version)" = v24.21.0
        npm install --global --no-audit --no-fund --ignore-scripts npm@12.1.0
        test "$(npm --version)" = 12.1.0
        out="$RUNNER_TEMP/crylo-final-parity"
        mkdir -p "$out"
