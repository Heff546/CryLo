name: CryLo Testnet.27 unified five-platform unsigned candidate builds

# A single source revision across Windows x64, Linux x64/ARM64,
# macOS Intel/Apple Silicon. No keys, no tags, no signing, no release.
on:
  push:
    branches:
      - testnet
    paths:
      - .github/workflows/testnet26-five-platform-unsigned.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crylo-testnet27-five-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-native-candidates:
    name: Native unsigned release candidate — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-22.04, arch: x64, machine: x86_64, jobs: '2' }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, arch: arm64, machine: aarch64, jobs: '1' }
    steps:
      - name: Checkout approved CryLo source and submodules without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: e2b37014d7b31d100003b28e2e2b9df76cbe1ffe
          persist-credentials: false
          set-safe-directory: false
          submodules: recursive
      - name: Confirm exact platform and build inputs
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(git rev-parse HEAD)" = 'e2b37014d7b31d100003b28e2e2b9df76cbe1ffe'
          test -z "$(git status --porcelain --untracked-files=all)"
          sh -n ./crylo
          node --check scripts/release/crylo-release.js
          node --check scripts/release/linux-native-update-preflight.js
          node --check scripts/crylo.js
          node --test security/tests/linux-native-update-preflight.test.js
          test -s contrib/depends/packages/boost.mk
          test -s contrib/depends/packages/openssl.mk
          test -s contrib/depends/packages/hidapi.mk
          test -s contrib/depends/packages/protobuf.mk
          test -s contrib/depends/packages/zeromq.mk
          echo 'PASS: clean exact branch source for mainnet-targeted Linux build'
      - name: Provision host-only compilation utilities on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config python3 perl make \
            autoconf automake libtool bison flex gettext \
            curl wget tar patch unzip file gcc-12 g++-12 binutils
          # Use GCC 12 for both pinned depends and CryLo's native build.
          # The 22.04 system GLIBC remains the compatibility baseline.
          toolchain="$RUNNER_TEMP/crylo-gcc12-bin"
          mkdir -p "$toolchain"
          ln -s /usr/bin/gcc-12 "$toolchain/gcc"
          ln -s /usr/bin/g++-12 "$toolchain/g++"
          ln -s /usr/bin/gcc-12 "$toolchain/cc"
          ln -s /usr/bin/g++-12 "$toolchain/c++"
          echo "$toolchain" >> "$GITHUB_PATH"
          cmake --version | sed -n '1p'
          make --version | sed -n '1p'
          "$toolchain/gcc" --version | sed -n '1p'
          "$toolchain/g++" --version | sed -n '1p'
          python3 --version
          df -h .
          echo 'Only host build utilities are provisioned; CryLo native libraries must come from hash-pinned contrib/depends'
      - name: Build CryLo native binaries and matching Electron output without signing
        shell: bash
        env:
          CRYLO_JOBS: ${{ matrix.jobs }}
          CC: gcc
          CXX: g++
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          test "$(gcc -dumpversion | cut -d. -f1)" -ge 12
          test "$(g++ -dumpversion | cut -d. -f1)" -ge 12
          gcc --version | sed -n '1p'
          g++ --version | sed -n '1p'
          sh ./crylo release
          test -s "build/linux-${{ matrix.arch }}/bin/CryLo-daemon"
          test -s "build/linux-${{ matrix.arch }}/bin/CryLo-wallet"
          test -s "build/linux-${{ matrix.arch }}/bin/CryLo-wallet-rpc"
          echo 'PASS: shared CryLo release builder verified GLIBC/GLIBCXX/CXXABI for Debian Bookworm or earlier'
          test -n "$(find electron/dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          echo 'PASS: Linux native compilation and Electron release candidate from exact source'
      - name: Record unsigned native output checksums and source commit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/crylo-linux-release-validation"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/SOURCE-COMMIT.txt"
          find "build/linux-${{ matrix.arch }}/bin" -maxdepth 1 -type f -name 'CryLo-*' -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum > "$out/NATIVE-SHA256SUMS.txt"
          test -s "$out/NATIVE-SHA256SUMS.txt"
          echo 'CI only. No official Pi1 manifest signature or release publication.' > "$out/UNSIGNED-VALIDATION-NOTICE.txt"
      - name: Upload unsigned CI artifacts only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-unified-${{ matrix.name }}-unsigned-build
          path: |
            build/linux-${{ matrix.arch }}/bin/CryLo-daemon
            build/linux-${{ matrix.arch }}/bin/CryLo-wallet
            build/linux-${{ matrix.arch }}/bin/CryLo-wallet-rpc
            electron/dist/*.AppImage
            electron/dist/*.deb
            ${{ runner.temp }}/crylo-linux-release-validation/*
          if-no-files-found: error
          retention-days: 30
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 210
    steps:
      - name: Checkout exact source and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: e2b37014d7b31d100003b28e2e2b9df76cbe1ffe
          persist-credentials: false
          set-safe-directory: false
          submodules: recursive
      - name: Verify frozen Testnet.27 HF21 source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e2b37014d7b31d100003b28e2e2b9df76cbe1ffe'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify exact trusted OpenSSL patch bytes on Windows checkout
        shell: cmd
        run: |
          node -e "const fs=require('fs'),c=require('crypto');const p='contrib/depends/patches/openssl/openssl-3.5.9-build-cleanup.patch';const b=fs.readFileSync(p);const d=c.createHash('sha256').update(b).digest('hex');if(d!=='5e04f3cd27a246512a573ed865b0ddd1390ebe7d667b3b74dbadb44ab6488088')throw Error('Windows OpenSSL patch bytes have changed: '+d);"
          if errorlevel 1 exit /b 1
          echo PASS: trusted original LF OpenSSL patch on Windows checkout
          node -e "const fs=require('fs'),c=require('crypto');const p='contrib/depends/patches/openssl/openssl-3.5.9-mingw-warning-compat.patch';const d=c.createHash('sha256').update(fs.readFileSync(p)).digest('hex');if(d!=='fc55415905380d6cb7ccb81c6b3c722142e7668b67f77d024f29d531f34f4700')throw Error('Windows OpenSSL MinGW patch bytes have changed: '+d);"
          if errorlevel 1 exit /b 1
          echo PASS: trusted LF MinGW OpenSSL patch on Windows checkout
      - name: Initialize MSYS2
        shell: cmd
        run: |
          if not exist C:\msys64\usr\bin\bash.exe exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "true"
          C:\msys64\usr\bin\bash.exe -lc "pacman --version"
          if errorlevel 1 exit /b 1
      - name: Finish MSYS2 core upgrade across fresh Windows CMD processes
        shell: cmd
        run: |
          rem A first MSYS2 core update can replace pacman and terminate its own
          rem shell with exit 1. Never suppress failure of the second fresh run.
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          rem After the first core phase, a second archive-tool upgrade may also
          rem exit 1 even though its packages were installed successfully.
          rem Only the fresh third audit is allowed to determine final success.
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          if errorlevel 1 exit /b 1
          rem pacman -Qu may exit 1 when no packages are pending; the third
          rem pacman -Syu command above is the definitive no-drift gate.
          C:\msys64\usr\bin\bash.exe -lc "pacman -Q pacman filesystem bsdtar"
          if errorlevel 1 exit /b 1
          echo PASS: MSYS2 core and full upgrade completed in fresh shells
      - name: Acquire exactly pinned and signed Windows build dependencies
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/crylo-reviewed-win-deps.sh"
          cat > "$script" <<'SH'
          set -euo pipefail
          export MSYSTEM=MINGW64
          export PATH=/mingw64/bin:/usr/bin
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-pkgconf make python python-pip perl \
            patch diffutils tar wget curl \
            mingw-w64-x86_64-boost mingw-w64-x86_64-protobuf \
            mingw-w64-x86_64-abseil-cpp mingw-w64-x86_64-zeromq \
            mingw-w64-x86_64-libsodium mingw-w64-x86_64-zstd \
            mingw-w64-x86_64-zlib mingw-w64-x86_64-icu \
            mingw-w64-x86_64-libiconv mingw-w64-x86_64-readline \
            mingw-w64-x86_64-ncurses mingw-w64-x86_64-miniupnpc \
            mingw-w64-x86_64-ldns
          mkdir -p /tmp/crylo-msys2-pinned
          cd /tmp/crylo-msys2-pinned
          cat > packages.txt <<'PINS'
          mingw-w64-x86_64-abseil-cpp-20260817.0-1-any.pkg.tar.zst 2fb525de7a87f25b4b5cfd2d0c8f2a40c24f7bebfc18aca4dd693e92e624c481
          mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst 89fb61549a437d65076a092a367fcb264fc7045ee9ebef48cd81f5a76a5588f8
          mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst 124edc26b009678a4c5e759481a364abf63ed7f2f49a53092e8bd0a47c0c0740
          mingw-w64-x86_64-unbound-1.26.1-1-any.pkg.tar.zst 4d737e09dd1137bb318e2d563962ddcbe511de02155e5835affc1f09d174c6a3
          mingw-w64-x86_64-libiconv-1.19-1-any.pkg.tar.zst 21e334d0911f25de75d3e18e0697648bcecfa9658256d600cad0827d719c2f35
          PINS
          while read -r file hash; do
            url="https://repo.msys2.org/mingw/mingw64/$file"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
              --silent --show-error --output "$file" "$url"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
              --silent --show-error --output "$file.sig" "$url.sig"
            printf '%s  %s\n' "$hash" "$file" | sha256sum -c -
            gpgv --keyring /etc/pacman.d/gnupg/pubring.gpg "$file.sig" "$file"
            pacman -Qp "$file"
          done < packages.txt
          pacman -U --noconfirm \
            mingw-w64-x86_64-abseil-cpp-20260817.0-1-any.pkg.tar.zst \
            mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst \
            mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst \
            mingw-w64-x86_64-unbound-1.26.1-1-any.pkg.tar.zst \
            mingw-w64-x86_64-libiconv-1.19-1-any.pkg.tar.zst
          cat > versions.txt <<'VERSIONS'
          mingw-w64-x86_64-hidapi 0.15.0
          mingw-w64-x86_64-libusb 1.0.30
          mingw-w64-x86_64-unbound 1.26.1
          mingw-w64-x86_64-boost 1.92.0
          mingw-w64-x86_64-protobuf 36.2
          mingw-w64-x86_64-abseil-cpp 20260817.0
          mingw-w64-x86_64-zeromq 4.3.5
          mingw-w64-x86_64-libsodium 1.0.22
          mingw-w64-x86_64-libiconv 1.19
          mingw-w64-x86_64-icu 78.3
          VERSIONS
          while read -r pkg expected; do
            actual="$(pacman -Q "$pkg" | awk '{print $2}' | sed -E 's/-[0-9]+$//')"
            test "$actual" = "$expected" || { echo "ERROR: pinned $pkg: expected $expected found $actual"; exit 1; }
            echo "VERIFIED: $pkg $actual"
          done < versions.txt
          for tool in x86_64-w64-mingw32-gcc cmake make pkg-config python3 protoc patch curl perl tar; do
            command -v "$tool"
          done
          echo 'PASS: pinned MSYS2 Windows build dependencies'
          SH
          tr -d '\r' < "$script" > "$script.unix"
          C:/msys64/usr/bin/bash.exe -lc "bash '$(cygpath -u "$script.unix")'"
      - name: Fail-fast diagnostic of native Protobuf DLL resolution before OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/crylo-protoc-runtime-gate.sh"
          cat > "$script" <<'SH'
          set -uo pipefail
          export MSYSTEM=MINGW64
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          echo '===== CRYLO MSYS2 CMAKE-SHELL PROTOC RUNTIME GATE ====='
          printf 'MSYSTEM=%s\nPATH=%s\n' "$MSYSTEM" "$PATH"
          echo "protoc=$(command -v protoc)"
          echo '===== Native protoc launch ====='
          protoc --version
          rc=$?
          echo "protoc exit status=$rc"
          if [ "$rc" -ne 0 ]; then
            echo '===== protoc imported Windows DLL names ====='
            /mingw64/bin/objdump.exe -p /mingw64/bin/protoc.exe | grep 'DLL Name:' || true
            echo '===== MSYS2 cygcheck runtime dependency resolution ====='
            if [ -x /usr/bin/cygcheck.exe ]; then
              /usr/bin/cygcheck.exe /mingw64/bin/protoc.exe || true
            else
              echo 'cygcheck.exe unavailable'
            fi
            echo '===== Selected environment variables ====='
            env | grep -Ei '^(MSYSTEM|MINGW_PREFIX|MSYS2_PATH_TYPE|PATH|LD_LIBRARY_PATH|PROTOBUF|CMAKE)=' || true
            echo 'FAIL: pinned protoc cannot execute from the exact Windows CMake shell'
            exit 1
          fi
          for required in libabsl_hash-2608.0.0.dll libabsl_log_initialize-2608.0.0.dll libabsl_strings-2608.0.0.dll; do
            test -f "/mingw64/bin/$required" || {
              echo "FAIL: matching Abseil runtime DLL missing: $required"
              exit 1
            }
          done
          pacman -Qkk mingw-w64-x86_64-protobuf mingw-w64-x86_64-abseil-cpp
          echo 'PASS: pinned protoc executes from Windows CMake shell'
          SH
          tr -d '\r' < "$script" > "$script.unix"
          C:/msys64/usr/bin/bash.exe -lc "bash '$(cygpath -u "$script.unix")'"
      - name: Verify normal-user CMD release prerequisites
        shell: cmd
        run: |
          set "CRYLO_JOBS=1"
          call crylo.cmd --check
          if errorlevel 1 exit /b 1
      - name: Build Windows native binaries and matching Electron without signing
        shell: cmd
        run: |
          set "CRYLO_JOBS=1"
          set "CSC_IDENTITY_AUTO_DISCOVERY=false"
          rem Native protoc requires the pinned MinGW DLL runtime in PATH.
          set "PATH=C:\msys64\mingw64\bin;C:\msys64\usr\bin;%PATH%"
          C:\msys64\mingw64\bin\protoc.exe --version
          if errorlevel 1 exit /b 1
          call crylo.cmd release
          if errorlevel 1 exit /b 1
          if not exist build\win-x64\bin\CryLo-daemon.exe exit /b 1
          if not exist build\win-x64\bin\CryLo-wallet.exe exit /b 1
          if not exist build\win-x64\bin\CryLo-wallet-rpc.exe exit /b 1
          if not exist build\electron-runtime\win\WINDOWS-BUILD-RUNTIME-MANIFEST.json exit /b 1
          echo PASS: Windows native and Electron unsigned release candidate
      - name: Compile and run real wallet storage roundtrip tests on Windows
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/crylo-windows-wallet-storage-tests.sh"
          cat > "$script" <<'SH'
          set -euo pipefail
          export MSYSTEM=MINGW64
          export PATH="/mingw64/bin:/usr/bin"
          root="${1:?Windows source checkout path argument was not supplied}"
          cd "$root/build/win-x64"
          test -f CMakeCache.txt
          grep -Fxq 'BUILD_TESTS:BOOL=OFF' CMakeCache.txt
          # Reuse the already-compiled native libraries and pinned OpenSSL;
          # enable only the unit_tests target, without repackaging Electron.
          cmake -D BUILD_TESTS=ON -D MONERO_WALLET_CRYPTO_BENCH=cn .
          grep -Fxq 'BUILD_TESTS:BOOL=ON' CMakeCache.txt
          cmake --build . --parallel 1 --target unit_tests
          executable="$(find . -type f -name unit_tests.exe -print -quit)"
          test -n "$executable" || { echo 'ERROR: wallet unit test executable absent'; exit 1; }
          test_listing="$("$executable" --gtest_list_tests)"
          grep -Fq 'account_tags_survive_store_and_reload' <<< "$test_listing"
          # Historical Monero fixture tests require wallet_00fd416a.keys,
          # which is not part of the CryLo repository. Do not fabricate that
          # key file or silently report legacy migration compatibility.
          test ! -f "$root/tests/data/wallet_00fd416a.keys" || {
            echo 'ERROR: historical wallet fixture appeared; reassess test selection'; exit 1;
          }
          echo 'NOTICE: 3 historical Monero wallet tests remain unvalidated (missing original .keys fixture).'
          "$executable" --data-dir "$root/tests/data" --gtest_filter='wallet_storage.store_to_mem2file:wallet_storage.change_password_in_memory:wallet_storage.change_password_mem2file:wallet_storage.account_tags_survive_store_and_reload:wallet_storage.crylo_uri_roundtrip:wallet_storage.generated_*'
          echo 'PASS: current CryLo wallet save/reopen, password and account-tag storage tests'
          SH
          tr -d '\r' < "$script" > "$script.unix"
          C:/msys64/usr/bin/bash.exe -lc "bash '$(cygpath -u "$script.unix")' '$(cygpath -u "$GITHUB_WORKSPACE")'"
      - name: Audit complete Windows standalone runtime closure
        shell: cmd
        run: |
          node -e "const fs=require('fs'),path=require('path'),c=require('crypto');const dir='build/electron-runtime/win';const v=JSON.parse(fs.readFileSync(path.join(dir,'WINDOWS-BUILD-RUNTIME-MANIFEST.json'),'utf8'));if(!Array.isArray(v.runtime)||v.runtime.length===0)throw Error('No Windows DLL closure');for(const x of v.runtime){const p=path.join(dir,x.file);const b=fs.readFileSync(p);const h=c.createHash('sha256').update(b).digest('hex');if(b.length!==x.size||h!==x.sha256)throw Error('Runtime DLL mismatch '+x.file);}console.log('PASS: exact '+v.runtime.length+' Windows DLLs retained for signable standalone bundle');"
          if errorlevel 1 exit /b 1
      - name: Record artifact hashes and source revision
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\crylo-windows-unsigned-audit"
          git rev-parse HEAD > "%RUNNER_TEMP%\crylo-windows-unsigned-audit\SOURCE-COMMIT.txt"
          certutil -hashfile build\win-x64\bin\CryLo-daemon.exe SHA256 > "%RUNNER_TEMP%\crylo-windows-unsigned-audit\DAEMON-SHA256.txt"
          if errorlevel 1 exit /b 1
          certutil -hashfile build\win-x64\bin\CryLo-wallet.exe SHA256 > "%RUNNER_TEMP%\crylo-windows-unsigned-audit\WALLET-SHA256.txt"
          if errorlevel 1 exit /b 1
          certutil -hashfile build\win-x64\bin\CryLo-wallet-rpc.exe SHA256 > "%RUNNER_TEMP%\crylo-windows-unsigned-audit\RPC-SHA256.txt"
          if errorlevel 1 exit /b 1
          echo CI validation only - not Pi1 signed > "%RUNNER_TEMP%\crylo-windows-unsigned-audit\UNSIGNED.txt"
      - name: Retain unsigned Windows candidate only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crylo-unified-windows-x64-unsigned-native-candidate
          path: |
            build/win-x64/bin/CryLo-daemon.exe
            build/win-x64/bin/CryLo-wallet.exe
            build/win-x64/bin/CryLo-wallet-rpc.exe
            build/electron-runtime/win/BINARY-MANIFEST.txt
            build/electron-runtime/win/WINDOWS-BUILD-RUNTIME-MANIFEST.json
            build/electron-runtime/win/*.dll
            electron/dist/*.exe
            ${{ runner.temp }}/crylo-windows-unsigned-audit/*
          if-no-files-found: error
          retention-days: 30
  mac-x64:
    name: "CryLo Testnet.27 exact source \u2014 mac-x64"
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
    - name: Checkout exact CryLo Testnet.27 source
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
        submodules: recursive
        ref: e2b37014d7b31d100003b28e2e2b9df76cbe1ffe
        set-safe-directory: false
    - name: Pinned packaging Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.21.0
    - name: Verify all tracked source, shared address contracts and package lock
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = 'e2b37014d7b31d100003b28e2e2b9df76cbe1ffe'
        test "$(uname -m)" = 'x86_64'
        test -z "$(git status --porcelain --untracked-files=all)"
        test "$(node --version)" = v24.21.0
        npm install --global --no-audit --no-fund --ignore-scripts npm@12.1.0
        test "$(npm --version)" = 12.1.0
        out="$RUNNER_TEMP/crylo-final-parity"
        mkdir -p "$out"
        git rev-parse HEAD > "$out/SOURCE-COMMIT.txt"
        git ls-tree -r HEAD > "$out/ALL-TRACKED-FILES.txt"
        git submodule status --recursive > "$out/SUBMODULES.txt"
        shasum -a 256 electron/package.json electron/package-lock.json node-operator/runtime/package-lock.json > "$out/SHARED-PACKAGE-HASHES.txt"
        node scripts/tests/install-win-linux-pi-static.js
        node --test scripts/tests/signed-update-contract.test.js electron/test/release-packaging-security.test.js
        python3 scripts/tests/crylo-functional-address-audit.py > "$out/ADDRESS-AUDIT.json"
        printf '%s\n' 'Unsigned CI candidate only. No official signing or publication.' > "$out/UNSIGNED.txt"
    - name: Prefetch unchanged hash-pinned ncurses source
      shell: bash
      run: |
        set -euo pipefail
        source_name='ncurses-6.6-20261010.tgz'
        source_hash='00a1d10c51c3aa1b4dae9ea4421aec2dd227fa4724e645850ed43fd6fc0a56ec'
        grep -Fx '$(package)_version=6.6-20261010' contrib/depends/packages/ncurses.mk
        grep -Fx "\$(package)_sha256_hash=$source_hash" contrib/depends/packages/ncurses.mk
        temporary="$(mktemp "$RUNNER_TEMP/ncurses-source-XXXXXX")"
        trap 'rm -f "$temporary"' EXIT
        fetched=0
        for origin in https://invisible-mirror.net/archives/ncurses/current https://www.invisible-island.net/archives/ncurses/current; do
          if curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 180 "$origin/$source_name" --output "$temporary"; then
            printf '%s  %s\n' "$source_hash" "$temporary" | shasum -a 256 -c -
            fetched=1
            break
          fi
        done
        test "$fetched" -eq 1
        mkdir -p contrib/depends/sources
        install -m 0644 "$temporary" "contrib/depends/sources/$source_name"
    - name: Read-only macOS toolchain and source audit
      shell: bash
      run: |
        set -euo pipefail
