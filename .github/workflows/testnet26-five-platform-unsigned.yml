    - name: Retain exact-baseline native binaries, PKG and provenance
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: crylo-testnet27-mac-x64-UNSIGNED
        path: |-
