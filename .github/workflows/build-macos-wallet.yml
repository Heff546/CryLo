name: Build macOS Wallet

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout c64chain-mainnet
        uses: actions/checkout@v4

      - name: Clone c64miner
        run: |
          git clone https://github.com/oxynaz/c64miner.git ${{ github.workspace }}/c64miner

      - name: Install Homebrew dependencies
        run: |
          brew install cmake boost openssl@3 zeromq miniupnpc hidapi libusb libuv pkg-config

      - name: Patch daemon to disable TUI (headless for Electron)
        run: |
          # Remove c64_tui.cpp from daemon sources
          sed -i.bak '/\.\.\/tui\/c64_tui\.cpp/d' src/daemon/CMakeLists.txt
          # Remove ncursesw link but keep closing parenthesis
          sed -i.bak 's/.*ncursesw.*/)/' src/daemon/CMakeLists.txt

          # Create stub c64_tui.h so includes compile
          cat > src/tui/c64_tui.h << 'STUB'
          #pragma once
          #include <atomic>
          #include <string>
          #include <mutex>
          #include <deque>
          namespace c64tui {
            struct NodeStats {
              std::mutex mtx;
              std::string status;
              struct LogLine { std::string text; int color; };
              std::deque<LogLine> log_lines;
              void set_status(const std::string&) {}
              void add_log(const std::string&, int=0) {}
            };
            inline NodeStats& get_stats() { static NodeStats s; return s; }
            inline void play_datasette_animation() {}
            inline void run_tui(std::atomic<bool>&) {}
          }
          STUB

          # Patch daemon.cpp: remove TUI calls, keep core/p2p logic
          python3 << 'PYEOF'
          c = open("src/daemon/daemon.cpp").read()
          import re
          # 1. Remove play_datasette call
          c = c.replace("c64tui::play_datasette_animation();", "// TUI disabled for headless build")
          # 2. Remove TUI thread creation
          c = re.sub(r"    // Start TUI in background thread.*?    \}\);\n", "", c, flags=re.DOTALL)
          # 3. Remove ncurses init + /dev/null redirect
          c = re.sub(r"    // Let ncurses.*?close\(devnull\);\n", "", c, flags=re.DOTALL)
          # 4. Replace "Wait for TUI to exit" with "wait for stop"
          c = re.sub(
              r"    // Wait for TUI to exit\n    if \(tui_thread\.joinable\(\)\)\n      tui_thread\.join\(\);\n\n    // TUI exited - stop everything",
              "    // Headless: wait for stop signal\n    while (!stop) { sleep(1); }\n\n    // Stop everything",
              c)
          open("src/daemon/daemon.cpp", "w").write(c)
          print("daemon.cpp patched OK")
          PYEOF

          # Patch main.cpp: stub any c64tui:: calls
          python3 << 'PYEOF2'
          import re
          c = open("src/daemon/main.cpp").read()
          c = re.sub(r'c64tui::\w+\([^)]*\);', '/* TUI disabled */', c)
          open("src/daemon/main.cpp", "w").write(c)
          print("main.cpp patched OK")
          PYEOF2

          echo "=== TUI disabled for headless build ==="

      - name: Build c64chaind and c64chain-wallet-rpc
        run: |
          ZMQ_PREFIX=$(brew --prefix zeromq)
          mkdir -p build-mac && cd build-mac
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_DEVICE_TREZOR=OFF \
            -DBOOST_ROOT=$(brew --prefix boost) \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DZeroMQ_DIR=${ZMQ_PREFIX}/lib/cmake/ZeroMQ \
            -DMINIUPNPC_LIBRARY=$(brew --prefix miniupnpc)/lib/libminiupnpc.dylib \
            -DMINIUPNPC_INCLUDE_DIR=$(brew --prefix miniupnpc)/include \
            -DHIDAPI_INCLUDE_DIR=$(brew --prefix hidapi)/include \
            -DHIDAPI_LIBRARY=$(brew --prefix hidapi)/lib/libhidapi.dylib \
            -DCMAKE_C_FLAGS="-I${ZMQ_PREFIX}/include" \
            -DCMAKE_CXX_FLAGS="-I${ZMQ_PREFIX}/include" \
            ..
          make -j$(sysctl -n hw.ncpu) daemon wallet_rpc_server

      - name: Patch c64miner to force-disable TUI
        run: |
          cd ${{ github.workspace }}/c64miner
          python3 << 'PYEOF'
          c = open("CMakeLists.txt").read()
          # 1. Remove C64MinerTui.cpp from sources
          c = c.replace("    src/tui/C64MinerTui.cpp\n", "")
          # 2. Remove find_package(Curses REQUIRED)
          c = c.replace("find_package(Curses REQUIRED)\n", "")
          # 3. Remove ${CURSES_LIBRARIES} from link
          c = c.replace("${CURSES_LIBRARIES} ", "")
          # 4. Add TUI disabled define
          c = "add_definitions(-DWITH_TUI_DISABLED)\n" + c
          open("CMakeLists.txt", "w").write(c)
          # Verify
          assert "C64MinerTui" not in c, "FAIL: C64MinerTui still in sources"
          assert "Curses" not in c, "FAIL: Curses still referenced"
          assert "WITH_TUI_DISABLED" in c, "FAIL: define missing"
          print("c64miner CMakeLists.txt patched OK:")
          print("  - C64MinerTui.cpp removed from sources")
          print("  - Curses removed")
          print("  - WITH_TUI_DISABLED defined")
          PYEOF

      - name: Build c64miner
        run: |
          cd ${{ github.workspace }}/c64miner
          mkdir -p build-mac && cd build-mac
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_HWLOC=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_TUI_DISABLED=ON \
            -DWITH_TLS=ON \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DUV_LIBRARY=$(brew --prefix libuv)/lib/libuv.a \
            -DUV_INCLUDE_DIR=$(brew --prefix libuv)/include \
            ..
          make -j$(sysctl -n hw.ncpu)

      - name: Collect macOS binaries
        run: |
          mkdir -p electron/bin/mac
          cp build-mac/bin/c64chaind-mainnet electron/bin/mac/c64chaind
          cp build-mac/bin/c64chain-wallet-rpc-mainnet electron/bin/mac/c64chain-wallet-rpc
          cp ${{ github.workspace }}/c64miner/build-mac/c64miner electron/bin/mac/
          chmod +x electron/bin/mac/*
          echo "=== macOS binaries ==="
          ls -la electron/bin/mac/
          file electron/bin/mac/*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Electron DMG
        run: |
          cd electron
          npm install
          npx electron-builder --mac --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        run: |
          ls -la electron/dist/
          ls -la electron/dist/*.dmg || true

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_FILE=$(ls electron/dist/*.dmg | head -1)
          DMG_NAME=$(basename "$DMG_FILE")
          echo "Uploading $DMG_NAME to release wallets-v1.1.1"
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/wallets-v1.1.1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          curl -s -X POST \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=C64.Chain.Wallet-1.1.1-macos-arm64.dmg" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            -T "$DMG_FILE"
          echo "Upload complete!"

      - name: Upload DMG as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: C64-Chain-Wallet-macOS
          path: electron/dist/*.dmg
