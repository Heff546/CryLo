name: CryLo Mac installed PKG command and data preservation

on:
  push:
    branches:
      - feature/mac-first-build-gate
    paths:
      - .github/workflows/mac-installed-cli-pkg-install-gate.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-pkg-install:
    name: Install CI-only PKG and verify crylo update — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel
            runner: macos-15-intel
            arch: x64
            mach: x86_64
          - name: apple-silicon
            runner: macos-15
            arch: arm64
            mach: arm64
    steps:
      - name: Checkout reviewed Mac installer and CLI source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Acquire exact updated Mac validation PKG and verify provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          MACH: ${{ matrix.mach }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$MACH"
          run=40226639468
          source_sha="$(gh api "repos/Heff546/CryLo/actions/runs/$run" --jq '.head_sha')"
          test "$source_sha" = 98aa82d4f6264fbfca0f73a32eaaebb51950aeff
          test "$(gh api "repos/Heff546/CryLo/actions/runs/$run" --jq '.conclusion')" = success
          d="$RUNNER_TEMP/crylo-installed-pkg-verify"
          mkdir -p "$d"
          gh run download "$run" --repo Heff546/CryLo \
            --name "crylo-macos-$ARCH-electron-security-validation" --dir "$d"
          pkg="$d/CryLo-1.1.1-mac-$ARCH-unsigned.pkg"
          test -s "$pkg"
          signature="$(pkgutil --check-signature "$pkg" 2>&1 || true)"
          printf '%s\n' "$signature" | grep -F 'Status: no signature'
          pkgutil --payload-files "$pkg" | grep -F 'usr/local/bin/crylo'
          echo "CRYLO_VALIDATION_PKG=$pkg" >> "$GITHUB_ENV"
          shasum -a 256 "$pkg"
      - name: Capture existing non-empty user data and install CI validation package
        shell: bash
        env:
          EXPECTED_MACH: ${{ matrix.mach }}
        run: |
          set -euo pipefail
          test ! -e '/Applications/CryLo Wallet.app'
          test ! -e '/usr/local/bin/crylo'
          mkdir -p "$HOME/Library/Application Support/CryLo/wallets"
          mkdir -p "$HOME/Library/Application Support/CryLo Wallet"
          mkdir -p "$HOME/.config/crylo-wallet"
          echo 'preserve wallet' > "$HOME/Library/Application Support/CryLo/wallets/wallet-sentinel"
          echo 'preserve chain data' > "$HOME/Library/Application Support/CryLo/chain-sentinel"
          echo 'preserve Electron config' > "$HOME/Library/Application Support/CryLo Wallet/settings-sentinel"
          echo 'preserve legacy rollback state' > "$HOME/.config/crylo-wallet/state-sentinel"
          # Privileged installation is ONLY on an ephemeral CI runner.
          # Normal users invoke crylo update and approve the verified PKG in macOS Installer.
          sudo /usr/sbin/installer -pkg "$CRYLO_VALIDATION_PKG" -target /
          test -x /usr/local/bin/crylo
          cmp /usr/local/bin/crylo scripts/release/macos-installed-command.sh
          export PATH="/usr/local/bin:$PATH"
          command -v crylo
          crylo help | grep -F 'crylo update'
          /bin/sh -n /usr/local/bin/crylo
          app='/Applications/CryLo Wallet.app'
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/CryLo Wallet")" = "$EXPECTED_MACH"
          r="$app/Contents/Resources/macos-update"
          for name in macos-installed-update.js macos-update-client.js macos-package-trust.js macos-unsigned-update-stage.js crylo-testnet-release-ed25519-public.pem; do
            test -s "$r/$name"
          done
          cmp "$r/macos-installed-update.js" scripts/release/macos-installed-update.js
          cmp "$r/macos-update-client.js" electron/security/macos-update-client.js
          node - <<'NODE'
          const crypto=require('node:crypto'), fs=require('node:fs');
          const p='/Applications/CryLo Wallet.app/Contents/Resources/macos-update/crylo-testnet-release-ed25519-public.pem';
          const der=crypto.createPublicKey(fs.readFileSync(p)).export({format:'der',type:'spki'});
          const actual=crypto.createHash('sha256').update(der).digest('hex');
          if(actual!=='86f4b72805393b1bb71a58d982a274b156c8b69e11fcba2739cba598901a7385') throw Error('Pi1 key mismatch');
          console.log('PASS: installed Pi1 release public key exact fingerprint');
          NODE
          echo 'PASS: installed native CryLo command is on user PATH and packaged trust bytes are exact'
      - name: Reinstall and reject corrupt PKG without losing user data
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/sbin/installer -pkg "$CRYLO_VALIDATION_PKG" -target /
          echo 'invalid PKG contents' > "$RUNNER_TEMP/crylo-failed-upgrade.pkg"
          if sudo /usr/sbin/installer -pkg "$RUNNER_TEMP/crylo-failed-upgrade.pkg" -target /; then
            echo 'ERROR: invalid installer unexpectedly succeeded' >&2
            exit 1
          fi
          test -x /usr/local/bin/crylo
          cmp /usr/local/bin/crylo scripts/release/macos-installed-command.sh
          test "$(cat "$HOME/Library/Application Support/CryLo/wallets/wallet-sentinel")" = 'preserve wallet'
          test "$(cat "$HOME/Library/Application Support/CryLo/chain-sentinel")" = 'preserve chain data'
          test "$(cat "$HOME/Library/Application Support/CryLo Wallet/settings-sentinel")" = 'preserve Electron config'
          test "$(cat "$HOME/.config/crylo-wallet/state-sentinel")" = 'preserve legacy rollback state'
          echo 'PASS: fresh install, reinstall, and invalid-PKG rejection preserved user data'
          echo 'NOTE: real newer-version upgrade and interactive Gatekeeper approval remain separate release gates'
