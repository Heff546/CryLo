name: CryLo Electron Nexus Wallet Readiness Smoke

on:
  push:
    branches:
      - release/electron-nexus-readiness-unified25
      - security/electron-private-reverse-bridge-v3-20261108
  pull_request:
    branches:
      - release/unified-release-v1.1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-bridge-network-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Check wallet JavaScript syntax
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/src/app.js
          node --check electron/security/bridge-status-store.js
      - name: Test private bridge capabilities and network separation
        run: node --test electron/test/bridge-status-capability.test.js
      - name: Check salted private reverse-bridge intent and no-public-native-address ABI
        run: node --test electron/test/private-reverse-bridge.test.js
      - name: Verify daily gas claim deadlines and protected vault display
        run: node --test electron/test/gas-treasury-policy.test.js
