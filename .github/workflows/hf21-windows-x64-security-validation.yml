name: CryLo HF21 Windows x64 native security validation

on:
  push:
    branches:
      - security/hf21-linux-x64-validation-20261122
    paths:
      - .github/workflows/hf21-windows-x64-security-validation.yml

permissions:
  contents: read

jobs:
  hf21-windows-x64:
    name: HF21 Windows native consensus and wallet tests
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout exact HF21 candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 04764f9221481095f6565e7a01761086fceff507
          submodules: recursive
          persist-credentials: false

      - name: Verify exact source
        shell: cmd
        run: |
          git rev-parse HEAD
          if errorlevel 1 exit /b 1
          git diff --quiet 04764f9221481095f6565e7a01761086fceff507
          if errorlevel 1 exit /b 1
          echo PASS: exact HF21 security candidate

      - name: Prepare MSYS2
        shell: cmd
        run: |
          if not exist C:\msys64\usr\bin\bash.exe exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "true"
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          if errorlevel 1 exit /b 1

      - name: Install MinGW native dependencies
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/hf21-windows-deps.sh"
          cat > "$script" <<'SH'
          set -euo pipefail
          export MSYSTEM=MINGW64
          export PATH="/mingw64/bin:/usr/bin"
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-pkgconf \
            mingw-w64-x86_64-boost \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-protobuf \
            mingw-w64-x86_64-abseil-cpp \
            mingw-w64-x86_64-zeromq \
            mingw-w64-x86_64-libsodium \
            mingw-w64-x86_64-zstd \
            mingw-w64-x86_64-zlib \
            mingw-w64-x86_64-icu \
            mingw-w64-x86_64-libiconv \
            mingw-w64-x86_64-readline \
            mingw-w64-x86_64-ncurses \
            mingw-w64-x86_64-miniupnpc \
            mingw-w64-x86_64-ldns \
            make python perl patch
          mkdir -p /tmp/crylo-msys2-pinned
          cd /tmp/crylo-msys2-pinned
          cat > packages.txt <<'PINS'
          mingw-w64-x86_64-abseil-cpp-20260817.0-1-any.pkg.tar.zst 2fb525de7a87f25b4b5cfd2d0c8f2a40c24f7bebfc18aca4dd693e92e624c481
          mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst 89fb61549a437d65076a092a367fcb264fc7045ee9ebef48cd81f5a76a5588f8
          mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst 124edc26b009678a4c5e759481a364abf63ed7f2f49a53092e8bd0a47c0c0740
          mingw-w64-x86_64-unbound-1.26.1-1-any.pkg.tar.zst 4d737e09dd1137bb318e2d563962ddcbe511de02155e5835affc1f09d174c6a3
          PINS
          while read -r file hash; do
            url="https://repo.msys2.org/mingw/mingw64/$file"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
              --silent --show-error --output "$file" "$url"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
              --silent --show-error --output "$file.sig" "$url.sig"
            printf '%s  %s\n' "$hash" "$file" | sha256sum -c -
            gpgv --keyring /etc/pacman.d/gnupg/pubring.gpg "$file.sig" "$file"
            pacman -Qp "$file"
          done < packages.txt
          pacman -U --noconfirm \
            mingw-w64-x86_64-abseil-cpp-20260817.0-1-any.pkg.tar.zst \
            mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst \
            mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst \
            mingw-w64-x86_64-unbound-1.26.1-1-any.pkg.tar.zst
          echo "===== RESTORE CANONICAL LIBICONV 1.19 ====="
          iconv_pkg="mingw-w64-x86_64-libiconv-1.19-1-any.pkg.tar.zst"
          iconv_url="https://repo.msys2.org/mingw/mingw64/$iconv_pkg"

          curl --fail --location --retry 3 --connect-timeout 15 \
            --max-time 180 --output "$iconv_pkg" "$iconv_url"
          curl --fail --location --retry 3 --connect-timeout 15 \
            --max-time 180 --output "$iconv_pkg.sig" "$iconv_url.sig"

          gpgv --keyring /etc/pacman.d/gnupg/pubring.gpg \
            "$iconv_pkg.sig" "$iconv_pkg"

          test "$(pacman -Qp "$iconv_pkg")" = \
            "mingw-w64-x86_64-libiconv 1.19-1"

          pacman -U --noconfirm "$iconv_pkg"

          test "$(pacman -Q mingw-w64-x86_64-libiconv)" = \
            "mingw-w64-x86_64-libiconv 1.19-1"
          echo "PASS: Canonical libiconv 1.19-1 installed and verified"

          cat > versions.txt <<'VERSIONS'
          mingw-w64-x86_64-hidapi 0.15.0
          mingw-w64-x86_64-libusb 1.0.30
          mingw-w64-x86_64-unbound 1.26.1
          mingw-w64-x86_64-boost 1.92.0
          mingw-w64-x86_64-protobuf 36.2
          mingw-w64-x86_64-abseil-cpp 20260817.0
          mingw-w64-x86_64-zeromq 4.3.5
          mingw-w64-x86_64-libsodium 1.0.22
          mingw-w64-x86_64-libiconv 1.19
          mingw-w64-x86_64-icu 78.3
          VERSIONS
          mismatch=0
          while read -r pkg expected; do
            actual="$(pacman -Q "$pkg" | awk '{print $2}' | sed -E 's/-[0-9]+$//')"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: pinned $pkg: expected $expected found $actual"
              mismatch=1
            else
              echo "VERIFIED: $pkg $actual"
            fi
          done < versions.txt
          test "$mismatch" -eq 0
          protoc --version
          cmake --version
          g++ --version
          SH
          C:/msys64/usr/bin/bash.exe -lc \
            "bash '$(cygpath -u "$script")'"

      - name: Build canonical Windows OpenSSL 3.5.9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'scripts/release/crylo-release.js'
          $temporary = 'scripts/release/.hf21-openssl-ci.cjs'
          $marker = "const officialReleaseTag ="
          $original = [IO.File]::ReadAllText($source)
          $position = $original.IndexOf($marker)
          if ($position -lt 0) {
            throw "Canonical release entrypoint not found"
          }
          if ($original.IndexOf($marker, $position + 1) -ge 0) {
            throw "Ambiguous canonical release entrypoint"
          }
          if (Test-Path $temporary) {
            throw "Temporary builder already exists"
          }
          $script = $original.Substring(0, $position) +
            "`nbuildWindowsPinnedOpenSSL(2);`n"
          try {
            [IO.File]::WriteAllText($temporary, $script)
            & node $temporary
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned Windows OpenSSL build failed"
            }
            if (!(Test-Path 'build/windows-deps/openssl-3.5.9/lib/libcrypto.a')) {
              throw "Canonical static libcrypto missing"
            }
            if (!(Test-Path 'build/windows-deps/openssl-3.5.9/lib/libssl.a')) {
              throw "Canonical static libssl missing"
            }
            Write-Host "PASS: Canonical CryLo OpenSSL 3.5.9 static libraries"
          }
          finally {
            Remove-Item $temporary -Force -ErrorAction SilentlyContinue
          }

      - name: Configure compile and run native HF21 tests
        shell: bash
        env:
          MONERO_RANDOMX_UMASK: "1"
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/hf21-windows-test.sh"
          cat > "$script" <<'SH'
          set -euo pipefail
          export MSYSTEM=MINGW64
          export PATH="/mingw64/bin:/usr/bin"
          export MONERO_RANDOMX_UMASK=1
          export PATH="$PATH:/c/Program Files/Git/cmd"

          command -v git
          command -v python

          cd "$1"

          echo "===== VERIFY EXACT HF21 SOURCE ====="
          test "$(git rev-parse HEAD)" = \
            "04764f9221481095f6565e7a01761086fceff507"
          git diff --quiet
          git diff --cached --quiet
          echo "PASS: No temporary OpenSSL source overlay"

          echo "===== CANONICAL WINDOWS NATIVE CONFIGURATION ====="
          command -v cmake
          command -v make
          command -v gcc
          command -v g++

          test -f build/windows-deps/openssl-3.5.9/lib/libcrypto.a
          test -f build/windows-deps/openssl-3.5.9/lib/libssl.a

          OPENSSL_ROOT="$(cygpath -m \
            "$PWD/build/windows-deps/openssl-3.5.9")"
          MSYS2_ROOT_WIN="$(cd / && pwd -W)"

          cmake -S . -B build/hf21-windows-test \
            -G "MSYS Makefiles" \
            -DSTATIC=ON \
            -DARCH=x86-64 \
            -DBUILD_64=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TAG=win-x64 \
            -DBUILD_TESTS=ON \
            -DBUILD_DOCUMENTATION=OFF \
            -DBUILD_DEBUG_UTILITIES=OFF \
            -DUSE_DEVICE_TREZOR=ON \
            -DUSE_DEVICE_TREZOR_LIBUSB=ON \
            -DTREZOR_DEBUG=OFF \
            -DBUILD_GUI_DEPS=OFF \
            -DCRYLO_WINDOWS_OPENSSL_ROOT="$OPENSSL_ROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/64-bit-toolchain.cmake" \
            -DMSYS2_FOLDER="$MSYS2_ROOT_WIN"

          echo "===== VERIFY RELEASE CONFIGURATION ====="
          CACHE="build/hf21-windows-test/CMakeCache.txt"
          grep -Fxq 'STATIC:BOOL=ON' "$CACHE"
          grep -Fxq 'BUILD_TESTS:BOOL=ON' "$CACHE"
          grep -Fxq 'ARCH:STRING=x86-64' "$CACHE" || \
            grep -Fxq 'ARCH:UNINITIALIZED=x86-64' "$CACHE"
          grep -Fq 'openssl-3.5.9' "$CACHE"

          echo "PASS: Static Windows release configuration"
          echo "PASS: Pinned OpenSSL 3.5.9 selected"
          echo "PASS: HF21 native tests enabled"

          echo "===== BUILD BUNDLED GOOGLE TEST FIRST ====="
          cmake --build build/hf21-windows-test \
            --target googletest --parallel 2

          echo "===== BUILD HF21 NATIVE UNIT TESTS ====="
          cmake --build build/hf21-windows-test \
            --target unit_tests --parallel 2

          testbin="build/hf21-windows-test/tests/unit_tests/unit_tests.exe"
          test -f "$testbin"

          echo "===== VERIFY STATIC RELEASE DLL POLICY ====="
          imports="$(objdump -p "$testbin" | grep 'DLL Name:' || true)"
          printf '%s\\n' "$imports"

          if printf '%s\\n' "$imports" | \
            grep -Ei 'DLL Name: (libunbound|libcrypto|libssl)'; then
            echo "ERROR: Dynamic Unbound/OpenSSL dependency detected"
            exit 1
          fi

          echo "PASS: No dynamic Unbound or OpenSSL imports"

          echo "===== WINDOWS EXECUTABLE DEPENDENCY DIAGNOSTICS ====="
          command -v objdump
          objdump -p "$testbin" | grep 'DLL Name:' || true

          if command -v ldd >/dev/null 2>&1; then
            ldd "$testbin" || true
          fi

          echo "===== WINDOWS NATIVE DLL LOADER PROBE ====="
          python - "$testbin" <<'DLLPROBE'
          import ctypes
          import re
          import subprocess
          import sys

          exe = sys.argv[1]
          output = subprocess.check_output(
              ["objdump", "-p", exe],
              text=True,
              errors="replace"
          )

          names = sorted({
              line.split("DLL Name:", 1)[1].strip()
              for line in output.splitlines()
              if "DLL Name:" in line
          }, key=str.lower)

          kernel = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel.LoadLibraryW.argtypes = [ctypes.c_wchar_p]
          kernel.LoadLibraryW.restype = ctypes.c_void_p
          kernel.FreeLibrary.argtypes = [ctypes.c_void_p]

          print(f"Direct imports: {len(names)}", flush=True)
          if not names:
              raise RuntimeError("DLL import parsing returned zero results")

          for name in names:
              handle = kernel.LoadLibraryW(name)
              if handle:
                  print(f"LOAD OK: {name}", flush=True)
                  kernel.FreeLibrary(handle)
              else:
                  error = ctypes.get_last_error()
                  print(f"LOAD FAILED: {name}, Win32={error}",
                        flush=True)

          print("DLL loader probe complete", flush=True)
          DLLPROBE

          echo "===== LAUNCH HF21 TESTS WITH EXIT DIAGNOSTICS ====="
          python - "$testbin" <<'RUNTEST'
          from pathlib import Path
          import subprocess
          import sys

          exe = Path(sys.argv[1]).resolve()
          print(f"Executable: {exe}", flush=True)
          print(f"Exists: {exe.is_file()}", flush=True)
          print(f"Size: {exe.stat().st_size}", flush=True)

          try:
              result = subprocess.run(
                  [str(exe),
                   "--gtest_filter=CryLoTestnetV21AdmissionFoundation.*:ringct.CryLoHF21*"],
                  timeout=300,
              )
              code = result.returncode
              print(f"Native exit code: {code}", flush=True)
              print(f"Native exit hex: 0x{code & 0xffffffff:08X}", flush=True)
              sys.exit(0 if code == 0 else 1)
          except Exception as exc:
              print(f"Executable launch exception: {type(exc).__name__}: {exc}",
                    flush=True)
              sys.exit(1)
          RUNTEST

          echo "PASS: Windows x64 HF21 native consensus and wallet tests"
          echo "No Electron packaging, release, signing or activation."
          SH
          C:/msys64/usr/bin/bash.exe -lc \
            "bash '$(cygpath -u "$script")' '$(cygpath -u "$GITHUB_WORKSPACE")'"
