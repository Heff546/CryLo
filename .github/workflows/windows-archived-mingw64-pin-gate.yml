name: CryLo Windows archived MINGW64 pin verification

on:
  push:
    branches:
      - feature/mac-first-build-gate
    paths:
      - .github/workflows/windows-archived-mingw64-pin-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archives:
    name: Verify exact MSYS2 MINGW64 package archives and signatures
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Initialize disposable MSYS2 shell
        shell: cmd
        run: |
          if not exist C:\msys64\usr\bin\bash.exe exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "true"
          C:\msys64\usr\bin\bash.exe -lc "pacman --version; pacman-conf --repo-list; pacman-key --list-keys"
          if errorlevel 1 exit /b 1
      - name: Verify official archived package existence and GPG signatures
        shell: bash
        run: |
          set -euo pipefail
          msys='C:/msys64/usr/bin/bash.exe'
          dir="$RUNNER_TEMP/crylo-msys2-pin-audit"
          mkdir -p "$dir"
          cat > "$dir/probe.sh" <<'SH'
          set -euo pipefail
          export PATH=/usr/bin:/mingw64/bin
          echo '===== MINGW64 package source configuration ====='
          pacman-conf --repo-list
          pacman -Sl mingw64 | grep -E 'mingw-w64-x86_64-(hidapi|libusb|unbound) ' || :
          printf '%s\n' '===== Archive verification ====='
          cd /tmp
          for pkg in \
            mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst \
            mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst \
            mingw-w64-x86_64-unbound-1.26.1-1-any.pkg.tar.zst; do
            printf '\n%s\n' "Checking upstream archive: $pkg"
            url="https://repo.msys2.org/mingw/mingw64/$pkg"
            if ! curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
                 --silent --show-error --output "$pkg" "$url"; then
              echo "BLOCKED: pinned MINGW64 archive unavailable at official repository: $pkg"
              exit 1
            fi
            if ! curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
                 --silent --show-error --output "$pkg.sig" "$url.sig"; then
              echo "BLOCKED: upstream package signature missing: $pkg"
              exit 1
            fi
            # pacman-key --verify requires administrative control of the system
            # keyring. CI only needs read-only detached-signature verification.
            test -s /etc/pacman.d/gnupg/pubring.gpg
            gpgv --keyring /etc/pacman.d/gnupg/pubring.gpg "$pkg.sig" "$pkg"
            case "$pkg" in
              mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst)
                echo '89fb61549a437d65076a092a367fcb264fc7045ee9ebef48cd81f5a76a5588f8  '"$pkg" | sha256sum -c - ;;
              mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst)
                echo '124edc26b009678a4c5e759481a364abf63ed7f2f49a53092e8bd0a47c0c0740  '"$pkg" | sha256sum -c - ;;
            esac
            sha256sum "$pkg"
            pacman -Qp "$pkg"
            rm -f -- "$pkg" "$pkg.sig"
          done
          echo 'PASS: three exact MSYS2 archive versions and independent signatures verified'
          SH
          tr -d '\r' < "$dir/probe.sh" > "$dir/probe-unix.sh"
          MSYS2_PATH="$(cygpath -u "$dir/probe-unix.sh" 2>/dev/null || true)"
          if [ -z "$MSYS2_PATH" ]; then
            # GitHub bash shell on Windows uses Git Bash, not the MSYS2 path resolver.
            MSYS2_PATH="$(printf '%s' "$dir/probe-unix.sh" | sed -E 's#^([A-Za-z]):#/\L\1#;s#\\#/#g')"
          fi
          "$msys" -lc "bash '$MSYS2_PATH'"
