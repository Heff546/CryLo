name: CryLo Windows wallet account-tag archive compatibility gate
on:
  push:
    branches: [feature/mac-first-build-gate]
    paths:
      - .github/workflows/windows-wallet-tags-archive-gate.yml
      - scripts/tests/windows-wallet-tags-archive-gate.cpp
permissions:
  contents: read
jobs:
  verify-wallet-archive:
    name: Windows-only original versus proposed account-tag archive
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Provision MSYS2 MinGW compiler and Boost
        shell: cmd
        run: |
          if not exist C:\msys64\usr\bin\bash.exe exit /b 1
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-boost"
          if errorlevel 1 exit /b 1
      - name: Compile and verify old/new wallet archive compatibility
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/c/msys64/mingw64/bin:$PATH"
          /c/msys64/mingw64/bin/g++.exe -std=c++17 -O0 -Wall -Wextra \
            -I src -I external \
            scripts/tests/windows-wallet-tags-archive-gate.cpp \
            -L /c/msys64/mingw64/lib -lboost_serialization \
            -o wallet-tags-archive-gate.exe
          ./wallet-tags-archive-gate.exe
          echo 'PASS: account-tag archive Windows-only gate; no release build'
