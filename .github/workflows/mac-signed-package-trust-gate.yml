name: CryLo Pi1 manifest trust for unsigned macOS launch PKGs

on:
  push:
    branches:
      - feature/mac-first-build-gate
    paths:
      - .github/workflows/mac-signed-package-trust-gate.yml
      - scripts/release/macos-package-trust.js
      - scripts/tests/macos-package-trust.test.js
      - scripts/release/macos-unsigned-update-stage.js
      - scripts/tests/macos-update-staging.test.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-launch-trust:
    name: Pi1-style Ed25519 unsigned-PKG trust — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel
            runner: macos-15-intel
            arch: x64
          - name: apple-silicon
            runner: macos-15
            arch: arm64
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Check source syntax and trust-boundary unit tests
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node --check scripts/release/macos-package-trust.js
          node --check scripts/tests/macos-package-trust.test.js
          node -e "if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
          node --check scripts/release/macos-unsigned-update-stage.js
          node --check scripts/tests/macos-update-staging.test.js
          node --test scripts/tests/macos-package-trust.test.js scripts/tests/macos-update-staging.test.js

      - name: Exercise real unsigned PKG with ephemeral test-only signing key
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          root="$RUNNER_TEMP/crylo-mac-unsigned-trust"
          mkdir -p "$root/payload" "$root/wallet"
          echo preserve-wallet-file > "$root/wallet/sentinel"
          echo synthetic-installer-data > "$root/payload/payload-sentinel"
          pkg="$root/CryLo-1.1.1-mac-$EXPECTED_ARCH-unsigned.pkg"
          /usr/bin/pkgbuild --root "$root/payload" \
            --identifier com.crylo.ci-unsigned-fixture \
            --version 1.1.1 --install-location /Applications "$pkg"
          test -s "$pkg"
          # This is intentionally unsigned. No Apple Developer ID is required.
          signature_output="$(/usr/sbin/pkgutil --check-signature "$pkg" 2>&1 || true)"
          printf '%s\n' "$signature_output" | grep -Fi 'no signature'
          export CI_UNSIGNED_PKG="$pkg"
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const {verifyMacPackage}=require('./scripts/release/macos-package-trust');
          const file=process.env.CI_UNSIGNED_PKG;
          const dir=path.dirname(file);
          const payload=fs.readFileSync(file);
          const keys=crypto.generateKeyPairSync('ed25519');
          const manifest={
            schema:1,product:'CryLo',network:'testnet',version:'1.1.1',
            releaseTag:'v1.1.1-testnet.20',releaseSequence:20,
            createdUtc:'2026-10-25T00:00:00Z',gitCommit:'a'.repeat(40),
            signatureAlgorithm:'Ed25519',hashAlgorithm:'SHA-256',
            artifacts:[{platform:'mac',architecture:process.arch,
              file:path.basename(file),size:payload.length,
              sha256:crypto.createHash('sha256').update(payload).digest('hex')}]
          };
          const manifestPath=path.join(dir,'crylo-release-manifest.json');
          const signaturePath=manifestPath+'.sig';
          const publicKeyPath=path.join(dir,'ephemeral-CI-ONLY-public.pem');
          const bytes=Buffer.from(JSON.stringify(manifest)+'\n');
          fs.writeFileSync(manifestPath,bytes);
          fs.writeFileSync(signaturePath,crypto.sign(null,bytes,keys.privateKey).toString('base64')+'\n');
          fs.writeFileSync(publicKeyPath,keys.publicKey.export({type:'spki',format:'pem'}));
          const args={
            packagePath:file,manifestPath,signaturePath,publicKeyPath,
            architecture:process.arch,network:'testnet',minimumSequence:20
          };
          const verified=verifyMacPackage(args);
          assert.equal(verified.appleDeveloperIdRequired,false);
          assert.equal(verified.installation,'requires-user-approval');
          assert.throws(()=>verifyMacPackage({...args,minimumSequence:21}),/rollback floor/);
          fs.appendFileSync(file,'tampered');
          assert.throws(()=>verifyMacPackage(args),/SHA-256|size/);
          console.log('PASS: real unsigned PKG requires test Ed25519 signature, exact size/hash and rollback floor');
          console.log('NOTE: ephemeral CI key is never a CryLo production release authority');
          NODE
          test "$(cat "$root/wallet/sentinel")" = preserve-wallet-file
          test -z "$(git status --porcelain)"
          echo 'PASS: no application installation, Gatekeeper bypass or wallet mutation'
